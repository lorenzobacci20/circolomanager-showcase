name: Publish portfolio
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full reviewed commit on main
        required: true
        type: string
permissions: {}
concurrency:
  group: showcase-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && inputs.approved_commit == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/build.py --verify-tree
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy reviewed artifact
        id: release
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
